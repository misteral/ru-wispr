name: Build Bottles

on:
  release:
    types: [created]

jobs:
  bottle:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Build bottle
        run: |
          brew tap misteral/dikto
          brew install --build-bottle misteral/dikto/dikto
          brew bottle --no-rebuild misteral/dikto/dikto

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dikto--*.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done
          gh release upload "${{ github.event.release.tag_name }}" dikto-*.bottle.tar.gz --repo misteral/dikto
